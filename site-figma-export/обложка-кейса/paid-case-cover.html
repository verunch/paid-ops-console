<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Paid · Обложка кейса</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<style>html,body{margin:0;padding:0}svg{display:block}</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="'IBM Plex Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1280" height="640" fill="#F4F2EE"/>

  <!-- left: title -->
  <text x="64" y="112" font-size="14" font-weight="700" letter-spacing="1.5" fill="#D95032">КЕЙС · UX/UI · PAID</text>
  <text font-size="46" font-weight="700" fill="#2B3936">
    <tspan x="64" y="180">27 полей поиска</tspan>
    <tspan x="64" y="236">на одном экране</tspan>
    <tspan x="64" y="292">без подписей</tspan>
  </text>
  <text font-size="18" fill="#5B6663">
    <tspan x="64" y="344">Внутренняя консоль платёжных операций:</tspan>
    <tspan x="64" y="372">группировка полей и правило тултипов</tspan>
  </text>

  <!-- left: metrics -->
  <g font-weight="700" font-size="38" fill="#D95032">
    <text x="64" y="468">27</text>
    <text x="204" y="468">−19 %</text>
    <text x="364" y="468">0</text>
    <text x="484" y="468">5</text>
  </g>
  <g font-size="14" fill="#5B6663">
    <text x="64" y="496">полей в форме</text>
    <text x="204" y="496">высоты формы</text>
    <text x="364" y="496">полей убрано</text>
    <text x="484" y="496">рабочих мест</text>
  </g>
  <line x1="64" y1="540" x2="640" y2="540" stroke="#D8DCDA"/>
  <text x="64" y="576" font-size="15" fill="#5B6663">Живой MVP · макеты для Figma · дизайн-система · RU / EN</text>

  <!-- right: form mock -->
  <rect x="704" y="64" width="512" height="512" rx="12" fill="#FFFFFF" stroke="#E2E8E6"/>

  <text x="728" y="104" font-size="14" font-weight="700" fill="#2B3936">Поиск по данным операции</text>
  <g font-size="13">
    <rect x="728" y="120" width="150" height="40" rx="6" fill="#FFFFFF" stroke="#E2E8E6"/>
    <text x="740" y="145" fill="#737373">UID операции</text>
    <rect x="890" y="120" width="140" height="40" rx="6" fill="#FFFFFF" stroke="#D95032" stroke-width="2"/>
    <text x="902" y="145" fill="#2B3936">TR-4521</text>
    <rect x="1042" y="120" width="150" height="40" rx="6" fill="#FFFFFF" stroke="#E2E8E6"/>
    <text x="1054" y="145" fill="#737373">Сумма</text>
  </g>
  <!-- tooltip: name of filled field -->
  <path d="M960 166 L954 172 L966 172 Z" fill="#2B3936"/>
  <rect x="905" y="172" width="110" height="28" rx="4" fill="#2B3936"/>
  <text x="960" y="191" font-size="12" fill="#FFFFFF" text-anchor="middle">Трекинг ID</text>

  <text x="728" y="240" font-size="14" font-weight="700" fill="#2B3936">Поиск по данным банковской карты</text>
  <g font-size="13">
    <rect x="728" y="256" width="100" height="40" rx="6" fill="#FFFFFF" stroke="#E2E8E6"/>
    <text x="740" y="281" fill="#737373">4 цифры</text>
    <rect x="840" y="256" width="110" height="40" rx="6" fill="#FFFFFF" stroke="#E2E8E6"/>
    <text x="852" y="281" fill="#737373">БИН</text>
    <rect x="962" y="256" width="230" height="40" rx="6" fill="#FFFFFF" stroke="#E2E8E6"/>
    <text x="974" y="281" fill="#737373">Маска карты</text>
  </g>
  <!-- tooltip: persistent format hint -->
  <path d="M778 302 L772 308 L784 308 Z" fill="#2B3936"/>
  <rect x="728" y="308" width="232" height="28" rx="4" fill="#2B3936"/>
  <text x="844" y="327" font-size="12" fill="#FFFFFF" text-anchor="middle">Введите последние 4 цифры карты</text>

  <rect x="1100" y="356" width="92" height="36" rx="6" fill="#D95032"/>
  <text x="1146" y="379" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Искать</text>

  <!-- results table -->
  <rect x="728" y="416" width="464" height="32" rx="4" fill="#F4F7F6"/>
  <g fill="#C3D5D0">
    <rect x="740" y="428" width="60" height="8" rx="4"/>
    <rect x="840" y="428" width="90" height="8" rx="4"/>
    <rect x="970" y="428" width="70" height="8" rx="4"/>
    <rect x="1080" y="428" width="60" height="8" rx="4"/>
  </g>
  <g fill="#E2E8E6">
    <rect x="740" y="464" width="70" height="8" rx="4"/><rect x="840" y="464" width="110" height="8" rx="4"/><rect x="970" y="464" width="60" height="8" rx="4"/><rect x="1080" y="464" width="80" height="8" rx="4"/>
    <rect x="740" y="496" width="60" height="8" rx="4"/><rect x="840" y="496" width="90" height="8" rx="4"/><rect x="970" y="496" width="80" height="8" rx="4"/><rect x="1080" y="496" width="70" height="8" rx="4"/>
    <rect x="740" y="528" width="80" height="8" rx="4"/><rect x="840" y="528" width="100" height="8" rx="4"/><rect x="970" y="528" width="70" height="8" rx="4"/><rect x="1080" y="528" width="60" height="8" rx="4"/>
  </g>
  <line x1="728" y1="484" x2="1192" y2="484" stroke="#F0F2F1"/>
  <line x1="728" y1="516" x2="1192" y2="516" stroke="#F0F2F1"/>
</svg>
</body>
</html>
